[project]
name = "travel-api"
version = "0.1.0"
description = "Travel Planner public API"
authors = [
    { name = "Gavin Chen", email = "gavin575@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pymongo>=4.19.0",
    "python-ulid>=4.0.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
    "testcontainers[mongodb]>=4.15.0",
    "ty>=0.0.89",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
