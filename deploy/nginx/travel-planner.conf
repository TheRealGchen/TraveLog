# Travel Planner site. Rendered to /etc/nginx/sites-available/travel-planner by
# `just provision`; placeholders like __DOMAIN__ are filled in then.
#
# This is the plain-HTTP site. Certbot (run right after by `just provision`) adds the
# HTTPS listener, the Let's Encrypt certificate, and an HTTP->HTTPS redirect to it, and
# renews the certificate automatically (certbot.timer).

upstream travel_planner_api {
    server 127.0.0.1:__API_PORT__;
    keepalive 16;
}

upstream travel_planner_web {
    server 127.0.0.1:__WEB_PORT__;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Requests are small JSON bodies.
    client_max_body_size 1m;

    # The API: data routes plus its public contract and docs. The web app calls these on the
    # same origin, so no CORS is involved.
    location /v1/ {
        include snippets/travel-planner-proxy.conf;
        proxy_pass http://travel_planner_api;
    }
    location = /openapi.json {
        include snippets/travel-planner-proxy.conf;
        proxy_pass http://travel_planner_api;
    }
    location = /llms.txt {
        include snippets/travel-planner-proxy.conf;
        proxy_pass http://travel_planner_api;
    }
    location /docs {
        include snippets/travel-planner-proxy.conf;
        proxy_pass http://travel_planner_api;
    }
    location = /redoc {
        include snippets/travel-planner-proxy.conf;
        proxy_pass http://travel_planner_api;
    }

    # Next.js build assets are content-hashed, so they can be cached for a long time.
    location /_next/static/ {
        include snippets/travel-planner-proxy.conf;
        proxy_pass http://travel_planner_web;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else is the web app.
    location / {
        include snippets/travel-planner-proxy.conf;
        proxy_pass http://travel_planner_web;
    }
}
